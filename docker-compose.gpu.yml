services:
  # GPU inference overlay.
  #
  # Requires an NVIDIA GPU plus the NVIDIA container toolkit, and a CUDA wheel
  # of llama-cpp-python placed in ml/wheels/ (see ml/wheels/README.txt). On a
  # slow connection that wheel is ~1.3 GB, which is why it is opt-in.
  #
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build ml
  #
  # Verify afterwards: curl http://localhost:8090/health
  # and check that "chat.gpu_layers" is -1 and generation is noticeably faster.
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
      args:
        LLAMA_CPP_VERSION: 0.3.19
    gpus: all
    environment:
      MODEL_DIR: /models
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      # With a GPU the 3B model is fast enough to keep, unlike the CPU-only
      # compose file, which pins the 1.5B for its ~2x token rate.
      CHAT_MODEL: Qwen/Qwen2.5-3B-Instruct-GGUF
      CHAT_MODEL_FILE: qwen2.5-3b-instruct-q4_k_m.gguf
      LLM_CTX: "4096"
      LLM_GPU_LAYERS: "-1"
      LLM_N_THREADS: "0"
      LLM_N_BATCH: "1024"
      LLM_MAX_TOKENS: "768"
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}

